name: Retired createBareTiles

# Retired. A push of tasks/createBareTiles used to start an existing
# Compute Engine virtual machine and run the task there. Nothing here
# creates or starts a machine. Running this by hand only records that.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retired
        run: echo "createBareTiles is retired. This run does not create or start a virtual machine." | tee -a "$GITHUB_STEP_SUMMARY"
