name: Fire tiles

# Builds the fire map tiles for one year from the COGs in
# gs://nature-watch-bucket/COGS/fire/<year>/ and uploads them to
# gs://nature-watch-tiles/fire/<year>/.
#
# Runs on a GitHub-hosted runner. There is no VM to create or switch off.
# Run it from the Actions tab: "Fire tiles" -> "Run workflow".
on:
  workflow_dispatch:
    inputs:
      year:
        description: Year to build, e.g. 2025
        required: true
        type: string
      dry_run:
        description: Build and check the tiles but do not upload them
        required: true
        type: boolean
        default: false
  # Pull requests that change the task do a dry run, so a change cannot break
  # the build unnoticed. They never upload.
  pull_request:
    paths:
      - 'tasks/fireTiles/**'
      - '.github/workflows/fireTiles.yml'

permissions:
  contents: read

concurrency:
  group: fire-tiles-${{ inputs.year || 'pull-request' }}
  cancel-in-progress: false

env:
  GDAL_IMAGE: ghcr.io/osgeo/gdal:ubuntu-small-3.11.4
  MAX_ZOOM: '9'
  SOURCE_BUCKET: gs://nature-watch-bucket/COGS/fire
  TILES_BUCKET: gs://nature-watch-tiles/fire

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Passed through env, never put into the shell script text
      YEAR: ${{ inputs.year || '2024' }}
      DRY_RUN: ${{ github.event_name == 'pull_request' || inputs.dry_run }}
    steps:
      - name: Check the inputs
        run: |
          if ! [[ "$YEAR" =~ ^20[0-9]{2}$ ]]; then
            echo "year must look like 2025, got: $YEAR" >&2
            exit 1
          fi
          echo "Year: $YEAR | dry run: $DRY_RUN"

      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Download the COGs
        run: |
          mkdir -p cogs
          gcloud storage cp "$SOURCE_BUCKET/$YEAR/*.tif" cogs/
          echo "COGs: $(ls cogs | wc -l), $(du -sh cogs | cut -f1)"

      - name: Build the tiles
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/work" -w /work \
            "$GDAL_IMAGE" \
            bash tasks/fireTiles/build_tiles.sh cogs build "$MAX_ZOOM"

      - name: Check the tiles
        run: |
          COUNT=$(find build/tiles -name '*.png' | wc -l)
          SIZE=$(du -sh build/tiles | cut -f1)
          {
            echo "### Fire tiles $YEAR"
            echo "- tiles: $COUNT ($SIZE), zoom 0-$MAX_ZOOM"
            echo "- dry run: $DRY_RUN"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the tiles
        if: env.DRY_RUN != 'true'
        run: |
          gcloud storage rsync --recursive build/tiles "$TILES_BUCKET/$YEAR"
          echo "- uploaded to $TILES_BUCKET/$YEAR/" >> "$GITHUB_STEP_SUMMARY"
