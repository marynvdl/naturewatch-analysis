name: Retired createBuiltTiles

# Retired. A push of tasks/createBuiltTiles or of this file used to create
# a Compute Engine virtual machine and leave it running. Nothing here
# creates or starts a machine. Running this by hand only records that.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retired
        run: echo "createBuiltTiles is retired. This run does not create or start a virtual machine." | tee -a "$GITHUB_STEP_SUMMARY"
