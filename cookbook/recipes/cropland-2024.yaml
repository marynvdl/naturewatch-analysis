# Hand-edited catalog for one layer year.
# Facts and tiles read sprout.path. That object is the published raster.
# Step 4 writes the static STAC files in the same v1/ prefix.
id: cropland-2024
title: GLAD annual cropland 2024, South Africa
source:
  name: GLAD annual cropland
  url: https://glad.umd.edu/dataset/annual-croplands
  download: https://glad.umd.edu/datasets/annual-croplands/2024/
  citation: "Khan et al. 2026, https://doi.org/10.1016/j.rse.2026.115438"
year: 2024
extent: south-africa
grid:
  crs: EPSG:4326
  pixel_size_deg: 0.00025
  dtype: uint8
seed:
  id: seed-cropland-glad-2024-v1
  path: gs://nature-watch-bucket/seeds/cropland/glad/2024/v1/
  # 10° tiles whose cells meet mainland South Africa. Names are GLAD's.
  tiles:
    - 20S_010E.tif
    - 20S_020E.tif
    - 20S_030E.tif
    - 30S_010E.tif
    - 30S_020E.tif
    - 30S_030E.tif
  # Opened 20S_020E.tif on 22 October 2026. Every pixel is 0 or 100.
  # The file sets no nodata value. 0 is everything that is not cropland.
  values:
    cropland: 100
    other: 0
    nodata: null
  # Mainland South Africa, source codes inside the boundary. 255 is not a GLAD code.
  clip:
    file: cropland-glad-2024-zaf.tif
    nodata: 255
    boundary:
      name: geoBoundaries ZAF ADM0
      year_represented: 2020
      url: https://github.com/wmgeolab/geoBoundaries/raw/9469f09/releaseData/gbOpen/ZAF/ADM0/geoBoundaries-ZAF-ADM0.geojson
sprout:
  id: cropland-2024-v1
  path: gs://nature-watch-bucket/sprouts/cropland/2024/v1/cropland-2024-zaf.tif
  values:
    cropland: 1
    not_cropland: 0
    nodata: 255
  outside_extent: nodata
  # 255 is the clip's nodata, not a GLAD code. It stays nodata in the sprout.
  from_seed:
    0: 0
    100: 1
    255: 255
# Display tiles. Gray value is the sprout class. Alpha 0 is nodata.
# Colour is applied in the client. The pyramid stops at zoom 12.
tiles:
  path: gs://nature-watch-tiles/cropland/2024/v1/
  min_zoom: 0
  max_zoom: 12
  scheme: xyz
  tile_size: 256
  resampling: max
  encoding: class-value
