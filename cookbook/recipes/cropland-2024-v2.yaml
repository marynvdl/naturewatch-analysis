sprout:
  id: cropland-2024-v2
  # One COG per seed tile under tiles_path, full-resolution classes, no overviews.
  # path is the VRT over them. Facts and Tiles read path. Resampling is Tiles' job.
  layout: per-tile
  path: gs://nature-watch-bucket/sprouts/cropland/2024/v2/cropland-2024.vrt
  tiles_path: gs://nature-watch-bucket/sprouts/cropland/2024/v2/tiles/
  values:
    cropland: 1
    not_cropland: 0
    nodata: 255
  outside_extent: nodata
  # Source 100 is cropland and source 0 is other land. There is no clip value.
  from_seed:
    0: 0
    100: 1
tiles:
  path: gs://nature-watch-tiles/cropland/2024/v2/cropland.pmtiles
  min_zoom: 0
  max_zoom: 12
  scheme: pmtiles
  encoding: class-value
  # Resampling is unset. The South Africa recipe used max. q3 is still open.
