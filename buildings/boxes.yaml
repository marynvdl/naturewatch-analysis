# Found by `compare.py tempo-scan -17 15 35 23`: the 6 km window with the most TEMPO pixels between 0 and 0.05 in each noisy tile.
  - {name: tagant-east, kind: empty, lat: 17.2238, lon: -9.0874, size_km: 6, label: "East of Tagant, Mauritania"}
