# Comparison boxes for the Buildings 2023 recipe (task 01) and the sprout check (task 03).
# size_km is the side of a square centred on lat, lon. compare.py snaps it outward to the sprout grid.
# kind: settlement boxes are the 10 November 2026 comparison, centred on a settlement.
#       empty boxes are land with no buildings where Google Temporal 2023 has data.
#       They measure TEMPO's false positives.
boxes:
  - {name: kongoussi, kind: settlement, lat: 13.326, lon: -1.533, size_km: 5, label: "Rural Burkina Faso (Kongoussi)"}
  - {name: mopti, kind: settlement, lat: 14.470, lon: -4.180, size_km: 5, label: "Central Mali (Mopti villages)"}
  - {name: timia, kind: settlement, lat: 18.103, lon: 8.776, size_km: 5, label: "Aïr, Niger (Timia)"}
  - {name: bardai, kind: settlement, lat: 21.356, lon: 17.000, size_km: 5, label: "Tibesti, Chad (Bardaï)"}
  - {name: mueda, kind: settlement, lat: -11.660, lon: 39.546, size_km: 5, label: "Northern Mozambique (Mueda)"}
  - {name: bria, kind: settlement, lat: 6.537, lon: 21.987, size_km: 5, label: "Bria, Central African Republic"}
  - {name: saint-flour, kind: settlement, lat: 45.034, lon: 3.093, size_km: 5, label: "Rural France (Saint-Flour)"}
